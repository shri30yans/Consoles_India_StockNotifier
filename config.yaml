platform:
  store:
    # optional URI; default is DATABASE_URL from .env (Supabase session pooler recommended on IPv4)
    dsn: null
  log_level: INFO
  log_json: false
  config_reload_seconds: 60

# Admin emails — users registering with these emails automatically get admin role
admin_emails:
  - shri30yans@gmail.com

defaults:
  poll_seconds: 60
  alerts:
    - type: back_in_stock
      channels: [gaming_alerts]

# Tracked products live only in the DB (catalog_products, catalog_watches). Runtime ignores this list.
# One-time: scripts/import_yaml_products_to_db.py if you still have products here; then keep this empty.
products: []

channels:
  - id: gaming_alerts
    name: Gaming Stock Alerts
    telegram:
      chat_id: env:TELEGRAM_CHAT_GAMING

  - id: deals_gaming
    name: Gaming Deals
    telegram:
      chat_id: env:TELEGRAM_CHAT_GAMING
    discord:
      webhook_url: env:DISCORD_CHANNEL_GAMING

  - id: deals_tech
    name: Tech Deals
    telegram:
      chat_id: env:TELEGRAM_CHAT_TECH

  - id: admin
    name: Admin
    telegram:
      chat_id: env:TELEGRAM_ADMIN_CHAT

  # Post as the account tied to access_token in .env (OAuth 1.0a). Add x_alerts to catalog_rules.channels to use.
  - id: x_alerts
    name: X (Twitter) alerts
    twitter: {}

platform_sources:
  # Disabled: amazon_wishlist (verbose logs, limited usefulness)
  # - type: amazon_wishlist
  #   url: https://www.amazon.in/hz/wishlist/ls/1TKJ9EPWU9E0A
  #   channels: [gaming_alerts]
  #   poll_seconds: 20
  #   category: gaming

  - type: amazon_deals
    poll_seconds: 3600
    minimum_discount_pct: 0.15
    max_links_per_seed: 50
    seed_urls:
      - https://www.amazon.in/deals
      - https://www.amazon.in/gp/goldbox
    category: gaming

  - type: flipkart_deals
    poll_seconds: 3600
    minimum_discount_pct: 0.15
    max_links_per_seed: 50
    seed_urls:
      # offers/deals-today is JS-gated (returns bot-detection page) — use search URLs instead
      - https://www.flipkart.com/search?q=gaming+console&sort=discount_asc
      - https://www.flipkart.com/search?q=electronics+deals&sort=discount_asc
    category: tech

  # Disabled: ajio_deals, myntra_deals (require Playwright for JS rendering)
  # - type: ajio_deals
  #   poll_seconds: 3600
  #   minimum_discount_pct: 0.15
  #   max_links_per_seed: 30
  #   seed_urls:
  #     - https://www.ajio.com/s/sale
  #   category: tech
  #
  # - type: myntra_deals
  #   poll_seconds: 3600
  #   minimum_discount_pct: 0.15
  #   max_links_per_seed: 30
  #   seed_urls:
  #     - https://www.myntra.com/offers
  #   category: tech

stock:
  fetch:
    jitter_max_seconds: 3.0
    max_concurrent_requests: 4
    max_concurrent_playwright: 2
    playwright_stealth: true

deals:
  scoring:
    threshold: 0.40
    repost_cooldown_hours: 24
  curation:
    approval_required: true
    approval_timeout_seconds: 1800
    admin_channel: admin
  routing:
    gaming: [deals_gaming]
    tech: [deals_tech]
    tech: [deals_tech]
