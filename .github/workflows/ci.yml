name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Avoid setuptools entrypoint plugins from the runner image breaking pytest startup.
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Validate config
        run: python -c "from commerce_platform.platform.config.loader import load; load('platform.yaml')"
      - name: Ruff
        run: ruff check commerce_platform tests
      - name: Ruff format
        run: ruff format --check commerce_platform tests
      - name: Mypy
        run: mypy commerce_platform
      - name: Pytest
        run: pytest -q
