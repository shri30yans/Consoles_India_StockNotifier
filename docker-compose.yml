services:
  commerce-platform:
    build: .
    container_name: commerce-platform
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "commerce_platform", "all"]
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs

  # Optional: run only the stock service for focused debugging.
  stock-notifier:
    build: .
    container_name: stock-notifier
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "commerce_platform", "stock"]
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    profiles: ["stock-only"]
