# Logical channels and their delivery bindings.
# `target` is preferentially an env var name. The notifier resolves it via os.environ.
# To add a channel: add an entry; to add a delivery surface: append a binding.
channels:
  - key: tech
    name: "Tech & Gadgets India"
    bindings:
      - notifier: telegram
        target: TELEGRAM_CHAT_TECH
      - notifier: discord
        target: DISCORD_CHANNEL_TECH
      - notifier: whatsapp
        target: WHATSAPP_TO_TECH

  - key: gaming
    name: "Gaming & PC India"
    bindings:
      - notifier: telegram
        target: TELEGRAM_CHAT_GAMING
      - notifier: discord
        target: DISCORD_CHANNEL_GAMING
      - notifier: whatsapp
        target: WHATSAPP_TO_GAMING
      - notifier: twitter
        target: ""

  - key: lifestyle
    name: "Lifestyle & Fashion India"
    bindings:
      - notifier: telegram
        target: TELEGRAM_CHAT_LIFESTYLE
      - notifier: whatsapp
        target: WHATSAPP_TO_LIFESTYLE

  - key: home
    name: "Home & Daily Essentials India"
    bindings:
      - notifier: telegram
        target: TELEGRAM_CHAT_HOME
      - notifier: whatsapp
        target: WHATSAPP_TO_HOME

  - key: unknown
    name: "General Deals (fallback)"
    bindings:
      - notifier: telegram
        target: TELEGRAM_CHAT_TECH
